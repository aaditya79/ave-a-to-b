[project]
name = "nyc-bike-commute-safety"
version = "0.1.0"
description = "Deep research over NYC crash, lane, and ridership data: compares safer bike commutes and shows the time cost"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "google-cloud-aiplatform>=1.40.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
    "h3>=4.1",
]

# Only the offline build/ scripts need these. Cloud Run installs the list above.
[dependency-groups]
build = [
    "osmnx>=2.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "requests>=2.31",
    "pytest>=8",
    "matplotlib>=3.11.2",
    "playwright>=1.64.1",
]
